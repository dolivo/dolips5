name: Build KytyPS5 for Demon's Souls testing (Windows)

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      jetsku_ref:
        description: Jetsku/KytyPS5 commit/branch (PGO performance fork)
        required: false
        default: ''
      official_ref:
        description: KytyPS5/KytyPS5 commit/branch (official upstream)
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the commits reviewed when this workflow was written (2026-10-14).
  JETSKU_REF: ${{ inputs.jetsku_ref || '28bc20f146a276479acf42d2e405fb46a4491b8e' }}
  OFFICIAL_REF: ${{ inputs.official_ref || '9e41d8320a2774b303fbad344c2347e8d0292e83' }}

jobs:
  # Performance candidate: Jetsku's U59 fork (Demon's Souls shader/compat work, command-processor
  # and VRAM work) built exactly like its own release: clang-cl 22.1.3, Release, LTO and PGO.
  jetsku-pgo:
    name: KytyPS5 U59 (Jetsku fork, PGO + LTO)
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Check out Jetsku/KytyPS5
        uses: actions/checkout@v4
        with:
          repository: Jetsku/KytyPS5
          ref: ${{ env.JETSKU_REF }}
          submodules: recursive

      - name: Set up Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install LLVM 22.1.3
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.3-win64.exe'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.3/LLVM-22.1.3-win64.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '/S', '/D=C:\LLVM-22.1.3' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installer exited with $($process.ExitCode)" }
          & 'C:\LLVM-22.1.3\bin\clang-cl.exe' --version | Select-Object -First 1

      # The PGO profile records hashed source paths, so the tree must be compiled from C:\kyty-src19.
      - name: Map the source to the PGO path
        shell: cmd
        run: |
          mklink /J C:\kyty-src19 "%GITHUB_WORKSPACE%"
          git config --global --add safe.directory C:/kyty-src19

      - name: Configure (Release, LTO, PGO)
        shell: cmd
        run: |
          set LLVM=C:/LLVM-22.1.3/bin
          for %%f in (C:\kyty-src19\tools\pgo\*.profdata) do set PGO_PROFILE=C:/kyty-src19/tools/pgo/%%~nxf
          echo PGO profile: %PGO_PROFILE%
          cmake -S C:\kyty-src19 -B _Build/windows ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DKYTY_EMULATOR_IPO=ON ^
            -DKYTY_PGO_USE=%PGO_PROFILE% ^
            -DKYTY_BUILD_ORIGIN=Fork ^
            -DKYTY_BUILD_REPOSITORY=Jetsku/KytyPS5 ^
            -DKYTY_RELEASE_TAG=dolips5-u59-pgo-%GITHUB_RUN_NUMBER% ^
            -DCMAKE_C_COMPILER=%LLVM%/clang-cl.exe ^
            -DCMAKE_CXX_COMPILER=%LLVM%/clang-cl.exe ^
            -DCMAKE_LINKER=%LLVM%/lld-link.exe ^
            -DCMAKE_AR=%LLVM%/llvm-lib.exe ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build and install
        shell: cmd
        run: |
          cmake --build _Build/windows --target launcher kyty_emulator --parallel
          if errorlevel 1 exit /b 1
          cmake --install _Build/windows --prefix _Build/windows/install

      - name: Package portable runtime
        shell: pwsh
        run: |
          $release = '_Build/windows/package'
          New-Item -ItemType Directory -Path $release | Out-Null
          Copy-Item -Path '_Build/windows/install/*' -Destination $release -Recurse
          Copy-Item -LiteralPath 'tools/u59-preset.json' -Destination $release
          Copy-Item -LiteralPath 'docs/EXPERIMENTAL.md' -Destination (Join-Path $release 'U59-README.md')
          Copy-Item -LiteralPath 'LICENSE' -Destination $release
          $fonts = Join-Path $release '3rdparty/tracy/profiler/src/font'
          New-Item -ItemType Directory -Path $fonts | Out-Null
          Copy-Item -Path '3rdparty/tracy/profiler/src/font/Roboto-*.ttf' -Destination $fonts
          Copy-Item -LiteralPath '3rdparty/SPIRV-Tools/LICENSE' -Destination (Join-Path $fonts 'LICENSE-Apache-2.0.txt')
          "Source: https://github.com/Jetsku/KytyPS5/commit/$(git rev-parse HEAD)" | Set-Content (Join-Path $release 'SOURCE.txt')
          Get-ChildItem $release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-U59-PGO-Windows-x64
          path: _Build/windows/package/**
          if-no-files-found: error

  # Official upstream main (newest of its branches), built like upstream's own CI: clang-cl, Release, LTO.
  official:
    name: KytyPS5 official main (LTO)
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Check out KytyPS5/KytyPS5
        uses: actions/checkout@v4
        with:
          repository: KytyPS5/KytyPS5
          ref: ${{ env.OFFICIAL_REF }}
          submodules: recursive

      - name: Set up Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure (Release, LTO)
        shell: cmd
        run: |
          cmake -S . -B _Build/windows ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -DKYTY_BUILD_ORIGIN=Fork ^
            -DKYTY_BUILD_REPOSITORY=KytyPS5/KytyPS5 ^
            -DKYTY_RELEASE_TAG=dolips5-official-%GITHUB_RUN_NUMBER% ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build and install
        shell: cmd
        run: |
          cmake --build _Build/windows --target launcher --parallel
          if errorlevel 1 exit /b 1
          cmake --install _Build/windows --prefix _Build/windows/install

      - name: Record source commit
        shell: pwsh
        run: |
          "Source: https://github.com/KytyPS5/KytyPS5/commit/$(git rev-parse HEAD)" | Set-Content '_Build/windows/install/SOURCE.txt'
          Get-ChildItem '_Build/windows/install'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-official-Windows-x64
          path: _Build/windows/install/**
          if-no-files-found: error
